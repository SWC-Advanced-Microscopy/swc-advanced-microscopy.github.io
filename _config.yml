title: "SWC Advanced Microscopy Facility"
description: "SWC Advanced Microscopy Facility webpage."
url: "https://swcmicroscopy.com"

# Empty because this is the live repo — served from the domain root via the
# CNAME file, not a subpath. Only the site-rebuild test repo needs this set
# to "/site-rebuild".
baseurl: ""

github_url: "https://github.com/orgs/SWC-Advanced-Microscopy/repositories"
bluesky_url: "https://bsky.app/profile/sainsburywellcome.bsky.social"

markdown: kramdown
plugins: []

exclude:
  - README.md
  - amf-site-rebuild-brief.md
  - bin/
  # Developer files for the map applet — its own docs, its standalone server
  # and the scripts that regenerate the basemap and thumbnails. The applet
  # itself (map/, data/, system_photos/) is served and must stay.
  - brainsaw_map/README.md
  - brainsaw_map/serve.sh
  - brainsaw_map/tools/
