<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BrainSaw map harness</title>
<link rel="stylesheet" href="map/brainsaw-map.css">
<style>body{background:#0a1120;color:#eee;font-family:sans-serif;padding:2rem}</style>
</head>
<body>
<button id="launch" type="button" disabled>Loading map…</button>

<script src="map/world.js"></script>
<script src="map/brainsaw-map.js"></script>
<script>
  BrainSawMap.create().then((map) => {
    const button = document.querySelector('#launch');
    button.disabled = false;
    button.textContent = 'Open the map';
    map.opener = button;
    button.addEventListener('click', () => map.open());
    window.__map = map;
  });
</script>
</body>
</html>
