<div id="pub-sections">Loading publications&hellip;</div>

<style>
  .pub-list { padding-left: 1.25em; }
  .pub-list li { margin-bottom: 0.9em; }
  .pub-meta { display: block; font-size: 0.9em; opacity: 0.75; }
</style>

<script>
async function initPublications() {
  const wrap = document.getElementById('pub-sections');

  let data;
  try {
    const res = await fetch('{{ "/assets/data/publications.json" | relative_url }}');
    data = (await res.json()).publications;
  } catch (err) {
    wrap.textContent = 'Could not load publication data.';
    return;
  }

  const sections = [
    { title: 'AMF "First Author" Publications', intro: 'AMF staff contributed in a "co-first author" capacity in these papers.', match: p => p.amf_authorship === 'first' },
    { title: 'AMF "Middle Author" Publications', intro: 'AMF staff contributed in a "middle author" capacity in these papers.', match: p => p.amf_authorship === 'middle' },
    { title: 'Publications From SWC Groups Using Our Equipment or Services', intro: '', match: p => p.amf_authorship === 'none' && p.affiliation === 'swc' },
    { title: 'Publications From External Groups Using Our Tools', intro: '', match: p => p.amf_authorship === 'none' && p.affiliation === 'external' }
  ];

  function metaLine(p) {
    const bits = [];
    if (p.pi.length) bits.push(p.pi.join(', '));
    const tags = [...p.equipment, ...p.software_tools, ...p.techniques];
    if (tags.length) bits.push(tags.join(', '));
    if (p.external_institution) bits.push(p.external_institution);
    return bits.join(' — ');
  }

  wrap.innerHTML = sections.map(section => {
    const pubs = data.filter(section.match).sort((a, b) => b.year - a.year);
    if (!pubs.length) return '';
    const items = pubs.map(p => `
      <li>
        <a href="${p.url}">${p.title}</a>; ${p.journal} ${p.year}
        ${metaLine(p) ? `<span class="pub-meta">${metaLine(p)}</span>` : ''}
      </li>`).join('');
    return `<h2>${section.title}</h2>${section.intro ? `<p>${section.intro}</p>` : ''}<ul class="pub-list">${items}</ul>`;
  }).join('');
}

initPublications();
</script>
